name: Sincronizzazione Automatica Hevy Garmin

on:
  schedule:
    - cron: '0 */4 * * *' # Gira da solo online ogni 4 ore
  workflow_dispatch: # Crea il tasto per farlo partire a mano quando vuoi

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa il programma
        run: pip install hevy2garmin

      - name: Avvia Sincronizzazione
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: hevy2garmin sync
