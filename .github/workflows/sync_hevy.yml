name: Sincronizzazione Automatica Hevy Garmin

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa il programma
        run: pip install hevy2garmin

      - name: Configura la sessione del Browser
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        run: |
          mkdir -p ~/.config/hevy2garmin/garmin_tokens
          # Creiamo il file di configurazione inserendo il gettone del browser
          echo '{"username": "${{ secrets.GARMIN_EMAIL }}", "session": ${{ secrets.GARMIN_TOKENS }}}' > ~/.config/hevy2garmin/garmin_tokens/${GARMIN_EMAIL}

      - name: Avvia Sincronizzazione
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        run: hevy2garmin sync
